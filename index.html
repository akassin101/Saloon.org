// A profile photo is shown at 96px, and at most in a lightbox. Uploading a raw
// camera file meant a 3 MB image was downloaded by every visitor to render a
// thumbnail. Downscale before it ever leaves the browser.
const PHOTO_MAX_DIM = 480;
const PHOTO_QUALITY = 0.82;

async function downscaleImage(file) {
  let source, usedBitmap = false;
  try {
    // The DEFAULT ignores EXIF orientation, which silently produces sideways
    // avatars for ordinary phone photos. Asking for 'from-image' is required.
    // The resize hints also let the decoder downsample as it decodes, so a huge
    // image never has to be materialised at full resolution on a phone.
    // No resize hints here: they are applied unconditionally by the decoder and
    // would UPSCALE an image smaller than the target, making it both blurrier
    // and larger than the original. Scaling happens on the canvas below, where
    // the real dimensions are known.
    source = await createImageBitmap(file, { imageOrientation: 'from-image' });
    usedBitmap = true;
  } catch (e) {
    // Fallback decode. <img> applies EXIF orientation itself in current
    // browsers, so no rotation is applied here either — doing so would
    // double-rotate.
    source = await new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload  = () => { URL.revokeObjectURL(url); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('could not decode image')); };
      img.src = url;
    });
  }

  const sw = source.width, sh = source.height;
  if (!sw || !sh) throw new Error('image has no dimensions');

  const scale = Math.min(1, PHOTO_MAX_DIM / Math.max(sw, sh)); // never upscale
  const w = Math.max(1, Math.round(sw * scale));
  const h = Math.max(1, Math.round(sh * scale));

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  // A format that can carry transparency would otherwise flatten to black when
  // encoded as JPEG.
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(source, 0, 0, w, h);
  if (usedBitmap && source.close) source.close();

  const blob = await new Promise((resolve, reject) => {
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('could not encode image')), 'image/jpeg', PHOTO_QUALITY);
  });

  const dataUri = await new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload  = () => resolve(r.result);
    r.onerror = () => reject(r.error || new Error('could not read image'));
    r.readAsDataURL(blob);
  });

  return { dataUri, width: w, height: h, bytes: blob.size };
}

let photoUploadInFlight = false;

async function handleProfilePhotoUpload(e) {
  const file = e.target.files[0];
  e.target.value = '';                       // allow re-picking the same file
  if (!file) return;
  // Two quick picks would otherwise race, and whichever response landed last
  // would win the local version number regardless of which one the server kept.
  if (photoUploadInFlight) { toast('Still saving the last photo...'); return; }
  photoUploadInFlight = true;
  try {
    await uploadProfilePhoto(file);
  } finally {
    photoUploadInFlight = false;
  }
}

async function uploadProfilePhoto(file) {
  if (!/^image\//.test(file.type || '')) { toast('Please choose an image file.'); return; }
  if (file.size > 15 * 1024 * 1024) { toast('That image is too large to process.'); return; }

  toast('Processing photo...');
  let out;
  try {
    out = await downscaleImage(file);
  } catch (err) {
    // Deliberately do NOT fall back to the original file: that would reintroduce
    // multi-megabyte uploads for exactly the broken inputs least worth storing.
    console.warn('[photo] downscale failed', err);
    toast('Could not process that image. Try a JPEG or PNG.');
    return;
  }

  try {
    const updated = await apiCall('PATCH', `/api/users/${currentUser.id}`, { photo: out.dataUri });
    // Only the version is kept client-side; the bytes stay on the server. The
    // changed version also changes the URL, which is what makes the browser
    // refetch instead of showing the cached previous photo.
    currentUser.photoVersion = updated.photoVersion;
    const idx = DB.users.findIndex(u => u.id === currentUser.id);
    if (idx >= 0) DB.users[idx] = { ...DB.users[idx], photoVersion: updated.photoVersion };
    DB.save();
    renderProfile(currentUser.id);
    toast('Profile photo updated.');
  } catch (err) {
    toast(err.message || 'Failed to save photo.');
  }
}

function openLightbox(userId) {
  const user = DB.users.find(u => u.id === userId);
  const url = photoUrl(user);
  if (!url) return;
  const img = document.getElementById('photo-lightbox-img');
  img.onerror = closeLightbox;
  img.src = url;
  document.getElementById('photo-lightbox').classList.add('open');
}

// A photo can 404 at runtime (version points at a file that is gone). Swap the
// broken image for the initials the no-photo path would have rendered.
//
// The initials travel in a data attribute rather than as a JS string literal in
// the handler: the browser HTML-decodes an attribute BEFORE evaluating it as
// JavaScript, so an escaped quote becomes a real quote again and escapes the
// string. Reading the value with getAttribute keeps it data at every step.
function avatarFallback(img) {
  const span = document.createElement('span');
  span.textContent = img.getAttribute('data-initials') || '';
  if (img.parentNode) img.parentNode.replaceChild(span, img);
}

function closeLightbox() {
  document.getElementById('photo-lightbox').classList.remove('open');
  document.getElementById('photo-lightbox-img').src = '';
}

function toggleFollow(targetId) {
  const auth = getAuthUser();
  if (!auth) { navigate('login'); return; }
  if (auth.id === targetId) return;
  auth.following = auth.following || [];
  const idx = auth.following.indexOf(targetId);
  const target = DB.users.find(u => u.id === targetId);
  if (idx > -1) {
    auth.following.splice(idx, 1);
    toast('Unfollowed ' + displayName(target) + '.');
  } else {
    auth.following.push(targetId);
    toast('Now following ' + displayName(target) + '.');
  }
  currentUser = auth; // keep UI reference in sync
  DB.save();
  bw('POST', '/api/users/' + targetId + '/follow', {});
  if (currentPage === 'profile') renderProfile(currentConvId);
}

// ─── UTILITIES ────────────────────────────────────────────────────────────────

const _escMap = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' };
function esc(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => _escMap[c]);
}

// Profile photos are data URIs rendered into an <img src>. Anything else is
// dropped: an arbitrary string here breaks out of the attribute and executes.
const DATA_IMAGE_RE = /^data:image\/(?:png|jpeg|jpg|gif|webp);base64,[A-Za-z0-9+/]+={0,2}$/;
function safeImage(value) {
  if (typeof value !== 'string') return '';
  const s = value.trim();
  return DATA_IMAGE_RE.test(s) ? s : '';
}

// Photos are served from the backend rather than inlined in the payload. The id
// is interpolated into an <img src>, so it is validated the same way a data URI
// was: this is the same injection surface, just a different value shape.
const USER_ID_RE = /^[a-z0-9]{1,40}$/;
function photoUrl(user) {
  if (!user || !user.photoVersion) return '';
  if (!USER_ID_RE.test(String(user.id || ''))) return '';
  const v = Number(user.photoVersion);
  if (!Number.isFinite(v)) return '';
  return BACKEND_URL + '/api/users/' + encodeURIComponent(user.id) + '/photo?v=' + v;
}

// esc() escapes characters, not schemes — a "javascript:" href survives it intact.
// Any user-supplied URL must pass through here before becoming an href.
function safeUrl(url) {
  if (!url) return '';
  let s = String(url).trim();
  if (!s) return '';
  // A bare "example.com" is meant as an external link, not a path on this site.
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = 'https://' + s;
  try {
    const p = new URL(s);
    return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : '';
  } catch (e) { return ''; }
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000), h = Math.floor(diff / 3600000), d = Math.floor(diff / 86400000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (h < 24) return h + 'h ago';
  if (d < 30) return d + 'd ago';
  return new Date(ts).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// Handle ?verify= and ?reset= query params before normal routing
(async function handleUrlTokens() {
  const params = new URLSearchParams(location.search);
  const verifyToken = params.get('verify');
  const resetToken  = params.get('reset');

  if (verifyToken && BACKEND_URL) {
    history.replaceState(null, '', location.pathname + location.hash);
    try {
      const res = await apiCall('POST', '/api/auth/verify-email', { token: verifyToken });
      currentUser = res.user;
      localStorage.setItem('saloon_session', res.user.id);
      localStorage.setItem('saloon_jwt', res.token);
      const idx = DB.users.findIndex(u => u.id === res.user.id);
      if (idx >= 0) DB.users[idx] = res.user; else DB.users.push(res.user);
      DB.save();
      loadSession();
      renderNav();
      navigate('home');
      toast('Email verified! Welcome to Saloon, ' + displayName(currentUser) + '.');
    } catch(e) {
      navigate('login');
      toast('Verification link is invalid or expired. Please request a new one.');
    }
    return;
  }

  if (resetToken && BACKEND_URL) {
    history.replaceState(null, '', location.pathname + location.hash);
    loadSession(); renderNav();
    // Show reset page with token stored in closure
    ['home','login','register','conversation','profile','reset'].forEach(p => {
      document.getElementById('page-' + p).style.display = 'none';
    });
    document.getElementById('page-reset').style.display = '';
    renderResetPassword(resetToken);
    return;
  }

  loadSession();
  renderNav();
  const _init = parseHash();

  if (BACKEND_URL) {
    // Paint immediately. A returning visitor sees their cached content right
    // away; a first-time visitor sees a placeholder rather than a blank screen.
    // Neither waits on the network.
    navigate(_init.page, _init.id);
    if (!DB.conversations.length && _init.page === 'home') renderLoadingPage('page-home', 'Loading conversations');

    backendInit().then(live => {
      // The flag means "startup finished", not "the backend answered".
      backendReady = true;
      loadSession();
      if (!live) {
        // Only seed on an actual failure. A backend that legitimately returns an
        // empty site must show an empty site, never fabricated conversations.
        if (!DB.conversations.length) seedData();
        toast('Could not reach the server — showing offline content.');
      }
      hydrateAfterLoad();
    });
  } else {
    navigate(_init.page, _init.id);
  }
})();
