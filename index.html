<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--
  GitHub Pages cannot set response headers, so the policy has to live here.
  The app is one file of inline scripts and inline onclick handlers, so
  script-src must permit 'unsafe-inline' and this cannot stop injected script
  from running. What it does stop is the step that makes an XSS profitable:
  connect-src and img-src are pinned, so injected code cannot beacon the JWT
  out to an attacker's host. Tighten script-src only after the inline handlers
  are gone.
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://accounts.google.com;
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com;
  font-src 'self' data: https://fonts.gstatic.com;
  img-src 'self' data: https://accounts.google.com https://lh3.googleusercontent.com https://saloonorg-production.up.railway.app;
  connect-src 'self' https://saloonorg-production.up.railway.app https://accounts.google.com;
  frame-src https://accounts.google.com;
  form-action 'self';
  base-uri 'self';
  object-src 'none'">
<title>Saloon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #f5f0e6;
    --surface: #fffdf6;
    --border: #d9cebc;
    --text: #1c1810;
    --muted: #7a6e5c;
    --accent: #8b2315;
    --accent-light: #fce9e6;
    --accent2: #1a3557;
    --danger: #8b2315;
    --like: #2d6a2d;
    --dislike: #8b2315;
    --highlight: #fef3c7;
    --highlight-border: #c9952a;
    --gold: #c9952a;
    --radius: 4px;
    --font-body: Georgia, 'Times New Roman', serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.7;
    min-height: 100vh;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  button {
    font-family: var(--font-ui);
    cursor: pointer;
    border: none;
    border-radius: var(--radius);
    transition: opacity 0.15s, background 0.15s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  input, textarea, select {
    font-family: var(--font-body);
    font-size: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    width: 100%;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 100px; line-height: 1.7; }

  /* NAV */
  nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 3px solid var(--accent);
    box-shadow: inset 0 -5px 0 0 var(--accent2), inset 0 -6px 0 0 var(--accent2);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
  }
  .nav-brand {
    font-family: var(--font-ui);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-logo-mark {
    flex-shrink: 0;
    display: block;
    transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
  }
  .nav-brand:hover .nav-logo-mark { transform: scale(1.08); }
  .nav-logo-wordmark {
    display: flex;
    flex-direction: column;
    gap: 0;
    line-height: 1;
  }
  .nav-logo-name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px;
    font-weight: 700;
    color: #1c1810;
    letter-spacing: 1px;
  }
  .nav-logo-rule {
    display: block;
    width: 100%;
    height: 1px;
    background: #c9952a;
    margin: 2px 0;
  }
  .nav-logo-tagline {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 9px;
    font-weight: 400;
    color: #8b2315;
    letter-spacing: 1.8px;
    text-transform: none;
  }
  .brand-name-wrap { display: none; }
  .brand-n-wrap { display: none; }
  .cowboy-hat-svg { display: none; }
  /* mug clink: each group animates toward center then back */
  @keyframes clink-l {
    0%   { transform: rotate(14deg); }
    28%  { transform: rotate(30deg) translateX(3px); }
    50%  { transform: rotate(12deg); }
    70%  { transform: rotate(16deg); }
    100% { transform: rotate(14deg); }
  }
  @keyframes clink-r {
    0%   { transform: rotate(-14deg); }
    28%  { transform: rotate(-30deg) translateX(-3px); }
    50%  { transform: rotate(-12deg); }
    70%  { transform: rotate(-16deg); }
    100% { transform: rotate(-14deg); }
  }
  .nav-brand:hover #mug-l { animation: clink-l 0.5s ease forwards; }
  .nav-brand:hover #mug-r { animation: clink-r 0.5s ease forwards; }
  /* foam fades on hover */
  #foam-l, #foam-r { transition: opacity 0.25s 0.1s; }
  .nav-brand:hover #foam-l,
  .nav-brand:hover #foam-r { opacity: 0; }
  /* header mugs clink on hover */
  .mugs-header:hover #mug-hl { animation: clink-l 0.5s ease forwards; }
  .mugs-header:hover #mug-hr { animation: clink-r 0.5s ease forwards; }
  #foam-hl, #foam-hr { transition: opacity 0.25s 0.1s; }
  .mugs-header:hover #foam-hl,
  .mugs-header:hover #foam-hr { opacity: 0; }
  .nav-tagline {
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.01em;
    font-style: italic;
  }
  .nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-ui);
    font-size: 14px;
  }
  .nav-user { color: var(--muted); font-size: 13px; }
  .btn-ghost {
    background: none;
    color: var(--accent);
    font-size: 14px;
    padding: 6px 12px;
    border: 1px solid var(--accent);
  }
  .btn-primary {
    background: var(--accent);
    color: white;
    font-size: 14px;
    padding: 6px 14px;
  }
  .btn-sm { font-size: 13px; padding: 4px 10px; }
  .btn-danger { background: var(--danger); color: white; font-size: 13px; padding: 5px 10px; }

  /* LAYOUT */
  .container { max-width: 740px; margin: 0 auto; padding: 40px 24px; }
  .container-wide { max-width: 900px; margin: 0 auto; padding: 40px 24px; }

  /* PAGE TITLE */
  .page-header { margin-bottom: 32px; }
  .page-header h1 {
    font-size: 28px;
    font-weight: normal;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .page-header p {
    color: var(--muted);
    font-size: 15px;
    font-family: var(--font-ui);
  }

  /* CATEGORY PILLS */
  .category-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }
  .cat-pill {
    font-family: var(--font-ui);
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .cat-pill:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
  .cat-pill.active { background: var(--accent); border-color: var(--accent); color: white; }
  .cat-badge {
    display: inline-block;
    font-family: var(--font-ui);
    font-size: 11px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 20px;
    padding: 1px 8px;
    vertical-align: middle;
    font-weight: 500;
  }

  /* FEED */
  .feed { display: flex; flex-direction: column; gap: 1px; }
  .feed-item {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .feed-item:hover { border-color: var(--gold); }
  .feed-item-title { font-size: 19px; font-weight: normal; margin-bottom: 8px; color: var(--text); }
  .feed-item-meta {
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .feed-item-meta .meta-stat { display: flex; align-items: center; gap: 4px; }
  .feed-item-snippet {
    margin: 10px 0 0;
    font-size: 15px;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .feed-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 20px;
    font-family: var(--font-ui);
    font-size: 14px;
  }
  .feed-tab {
    padding: 10px 18px;
    cursor: pointer;
    color: var(--muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .feed-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* AUTH PAGES */
  .auth-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px 40px;
    max-width: 440px;
    margin: 60px auto 0;
  }
  .auth-card h2 { font-size: 22px; font-weight: normal; margin-bottom: 8px; }
  .auth-card .auth-sub {
    font-size: 14px;
    color: var(--muted);
    font-family: var(--font-ui);
    margin-bottom: 28px;
  }
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .form-note {
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
    line-height: 1.5;
  }
  .form-actions { margin-top: 24px; }
  .form-actions .btn-primary { padding: 10px 20px; font-size: 15px; width: 100%; }
  .btn-google {
    width: 100%; padding: .7rem 1rem;
    background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 15px;
    font-family: var(--font-ui); font-weight: 500;
    color: var(--text); display: flex; align-items: center;
    justify-content: center; gap: 10px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-google:hover { background: #f5f5f5; border-color: #aaa; }
  .auth-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 16px 0; font-family: var(--font-ui);
    font-size: 13px; color: var(--muted);
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
  .auth-switch {
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    font-family: var(--font-ui);
    margin-top: 18px;
  }
  .id-upload-area {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 22px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s;
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--muted);
  }
  .id-upload-area:hover, .id-upload-area.has-file { border-color: var(--accent); color: var(--accent); }
  .id-upload-area input[type="file"] { display: none; }

  /* CONVERSATION PAGE */
  .conv-header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 24px;
    margin-bottom: 32px;
  }
  .conv-title-wrap { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
  .conv-title { font-size: 30px; font-weight: normal; letter-spacing: -0.02em; flex: 1; }
  .conv-title-input {
    font-size: 28px;
    font-family: var(--font-body);
    flex: 1;
    border: 1px dashed var(--accent);
    padding: 2px 6px;
  }
  .conv-meta {
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: center;
  }
  .stat-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 13px;
    font-family: var(--font-ui);
  }
  .stat-pill.clickable { cursor: pointer; transition: background 0.15s; }
  .stat-pill.clickable:hover { background: var(--accent-light); border-color: var(--accent); }
  .stat-pill.active-like { background: #d4edda; border-color: var(--like); color: var(--like); }
  .stat-pill.active-dislike { background: #f8d7da; border-color: var(--dislike); color: var(--dislike); }
  .participants-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .participant-chip {
    font-family: var(--font-ui);
    font-size: 12px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 20px;
    padding: 2px 10px;
  }

  /* POSTS */
  .posts { display: flex; flex-direction: column; gap: 0; }
  .posts-card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0 28px;
    margin-top: 20px;
  }
  .post { padding: 28px 0; border-bottom: 1px solid var(--border); position: relative; }
  .post-author {
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .post-author-name { color: var(--accent); font-weight: 500; }
  .post-content { white-space: pre-wrap; line-height: 1.8; font-size: 17px; }
  .post-content .annotated {
    background: var(--highlight);
    border-bottom: 2px solid var(--highlight-border);
    cursor: pointer;
    border-radius: 2px;
    padding: 0 1px;
  }
  .post-content .annotated:hover { background: #fde68a; }
  .post-actions { margin-top: 14px; display: flex; gap: 10px; font-family: var(--font-ui); font-size: 13px; }
  .post-action-btn {
    background: none;
    color: var(--muted);
    font-size: 13px;
    padding: 3px 8px;
    border: 1px solid transparent;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-ui);
  }
  .post-action-btn:hover { border-color: var(--border); color: var(--text); opacity: 1; }

  /* ANNOTATIONS */
  .annotation-bubble {
    background: var(--surface);
    border: 1px solid var(--highlight-border);
    border-left: 3px solid var(--highlight-border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin: 8px 0 0 16px;
    font-size: 15px;
  }
  .annotation-bubble .quoted-text {
    font-style: italic;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 6px;
    font-family: var(--font-ui);
  }
  .annotation-bubble .ann-meta { font-family: var(--font-ui); font-size: 12px; color: var(--muted); margin-top: 6px; }

  .conv-comments-section { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--border); }
  .conv-comments-section h3 {
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font-ui);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 20px;
  }
  .comment-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .comment-item:last-child { border-bottom: none; }
  .comment-meta { font-family: var(--font-ui); font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .comment-meta .comment-author { color: var(--accent); }
  .comment-quoted {
    background: var(--highlight);
    border-left: 3px solid var(--highlight-border);
    padding: 4px 10px;
    font-style: italic;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 6px;
    border-radius: 2px;
  }
  .comment-content { font-size: 16px; }

  /* COMPOSE */
  .compose-area {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 32px;
  }
  .compose-area h4 {
    font-family: var(--font-ui);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .compose-area .submit-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
    gap: 8px;
    align-items: center;
  }
  .compose-hint { font-family: var(--font-ui); font-size: 12px; color: var(--muted); flex: 1; }

  /* FLOATING ANNOTATION TRIGGER */
  #annotation-trigger {
    display: none;
    position: fixed;
    z-index: 200;
    background: var(--accent);
    color: white;
    font-family: var(--font-ui);
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    white-space: nowrap;
  }
  #annotation-trigger:hover { opacity: 0.9; }

  /* PARTICIPANTS PANEL */
  .participants-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-top: 24px;
  }
  .participants-panel h4 {
    font-family: var(--font-ui);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .add-participant-row { display: flex; gap: 8px; margin-top: 12px; }
  .add-participant-row input { flex: 1; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 300;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 36px;
    max-width: 520px;
    width: 100%;
    margin: 24px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-box h2 { font-size: 22px; font-weight: normal; margin-bottom: 20px; }
  .modal-close {
    position: absolute;
    top: 16px; right: 20px;
    background: none;
    font-size: 22px;
    color: var(--muted);
    line-height: 1;
  }

  .comment-context-box {
    background: var(--highlight);
    border: 1px solid var(--highlight-border);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-style: italic;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  /* TOAST */
  #toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: white;
    font-family: var(--font-ui);
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 999;
  }
  #toast.show { opacity: 1; }

  /* EMPTY STATES */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); font-family: var(--font-ui); }
  .empty-state .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .empty-state h3 { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
  .empty-state p { font-size: 14px; }

  /* BADGES */
  .badge {
    display: inline-block;
    font-family: var(--font-ui);
    font-size: 11px;
    background: var(--accent-light);
    color: var(--accent);
    border-radius: 20px;
    padding: 1px 7px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .badge.pending { background: #fef9c3; color: #b45309; }
  .badge.verified { background: #dcfce7; color: #15803d; }
  .badge.rejected { background: #fee2e2; color: #b91c1c; }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    nav { padding: 0 16px; }
    .nav-tagline { display: none; }
    .container, .container-wide { padding: 24px 16px; }
    .auth-card { padding: 24px 20px; margin-top: 20px; }
    .modal-box { padding: 24px 20px; }
    .form-row { flex-direction: column; gap: 0; }
  }

  /* COMMENT VIEW TOGGLE */
  .comment-view-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-ui);
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .comment-view-toggle span { margin-right: 4px; }
  .cvt-btn {
    background: none;
    color: var(--muted);
    font-size: 12px;
    font-family: var(--font-ui);

<script>
'use strict';

// ─── BACKEND CONFIG ────────────────────────────────────────────────────────────
// Set BACKEND_URL to your server address to enable shared/persistent mode.
// Leave as null to run standalone — all data stays in this browser only.
//
//   Local mode  : const BACKEND_URL = null;
//   Server mode : const BACKEND_URL = 'http://localhost:3000';
//                 const BACKEND_URL = 'https://your-domain.com';
//
const BACKEND_URL = 'https://saloonorg-production.up.railway.app';

// Low-level fetch wrapper. Returns parsed JSON or throws with a clean message.
async function apiCall(method, path, body, extraHeaders) {
  if (!BACKEND_URL) return null;
  const jwt = localStorage.getItem('saloon_jwt');
  // A null body used to be serialised as the string "null", which express.json
  // rejects in strict mode — so every DELETE in the app was failing with 400
  // before it ever reached its route. Send no body at all instead.
  const hasBody = body !== undefined && body !== null;
  // Extra headers can never replace the session header — spreading them last
  // would let a future call site silently swap out the bearer token.
  const extra = {};
  Object.keys(extraHeaders || {}).forEach(k => {
    if (k.toLowerCase() !== 'authorization') extra[k] = extraHeaders[k];
  });
  const res = await fetch(BACKEND_URL + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...extra,
      ...(jwt ? { Authorization: 'Bearer ' + jwt } : {})
    },
    ...(hasBody ? { body: JSON.stringify(body) } : {})
  });
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// Fire-and-forget: write to backend without blocking the UI.
function bw(method, path, body) {
  if (!BACKEND_URL) return;
  apiCall(method, path, body).catch(e => console.warn('[Saloon backend write]', path, e.message));
}

// Pull latest data from backend and hydrate the local DB, then re-render.
// Resolves true when live data was loaded, false when the backend could not be
// reached. It deliberately does not reject: callers branch on the result, and a
// thrown error here would take down startup.
async function backendInit() {
  if (!BACKEND_URL) return false;
  try {
    const data = await apiCall('GET', '/api/data');
    if (data) {
      DB.users         = data.users        || DB.users;
      DB.conversations = data.conversations || DB.conversations;
      DB.posts         = data.posts        || DB.posts;
      DB.comments      = data.comments     || DB.comments;
      DB.invitations   = data.invitations  || DB.invitations;
      DB.save();
    }
    // Re-validate the stored JWT
    const stored = localStorage.getItem('saloon_jwt');
    if (stored) {
      const me = await apiCall('GET', '/api/auth/me').catch(() => null);
      if (me) {
        currentUser = me;
        const idx = DB.users.findIndex(u => u.id === me.id);
        if (idx >= 0) DB.users[idx] = me; else DB.users.push(me);
        DB.save();
      } else {
        localStorage.removeItem('saloon_jwt');
        localStorage.removeItem('saloon_session');
        currentUser = null;
      }
    }
    return true;
  } catch(e) {
    console.warn('[Saloon] Backend unreachable — running in local mode.', e.message);
    return false;
  }
}

// ─── CATEGORIES ───────────────────────────────────────────────────────────────

const CATEGORIES = ['Politics','Religion','Science','History','Psychology','Law','Philosophy','Economics','Culture','Technology'];

// ─── DATA LAYER ───────────────────────────────────────────────────────────────

const DB = {
  users: [],
  conversations: [],
  posts: [],
  comments: [],
  invitations: [],

  save() {
    _scoreCache.clear();
    try {
      // ID data is intentionally excluded — stored separately in IDSTORE
      const payload = {
        users: DB.users.map(u => {
          // Never persist the raw ID image, nor a legacy inline photo: an old
          // cache could otherwise re-save megabytes of base64 on every write.
          const { idFile, photo, ...safe } = u;
          return safe;
        }),
        conversations: DB.conversations,
        posts: DB.posts,
        comments: DB.comments,
        invitations: DB.invitations || []
      };
      localStorage.setItem('saloon_v1', JSON.stringify(payload));
    } catch(e) { console.warn('Save failed', e); }
  },

  load() {
    try {
      const raw = localStorage.getItem('saloon_v1');
      if (raw) {
        const d = JSON.parse(raw);
        DB.users = d.users || [];
        DB.conversations = d.conversations || [];
        DB.posts = d.posts || [];
        DB.comments = d.comments || [];
        DB.invitations = d.invitations || [];
        // Migrate: clear any garbled categories left over from the template-literal bug
        const _validCats = new Set(['Politics','Religion','Science','History','Psychology','Law','Philosophy','Economics','Culture','Technology']);
        DB.conversations.forEach(c => { if (c.category && !_validCats.has(c.category)) c.category = ''; });
      }
    } catch(e) { DB.users=[]; DB.conversations=[]; DB.posts=[]; DB.comments=[]; }
  },

  uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
};

// ─── ID STORE (isolated from main DB) ────────────────────────────────────────
// ID images are kept in a separate, obfuscated key so they are not
// bundled with general user data and cannot be accessed via the main DB object.

const IDSTORE = {
  _key(userId) {
    // Slightly obfuscated key — not security through obscurity alone, but
    // ensures casual DB inspection doesn't surface raw ID images.
    return 'sl_' + btoa(userId).replace(/=/g,'') + '_id';
  },
  set(userId, dataUrl) {
    try { localStorage.setItem(this._key(userId), dataUrl); } catch(e) {}
  },
  has(userId) {
    return !!localStorage.getItem(this._key(userId));
  },
  // No public get() — ID data should never be read back into the app.
  // A real deployment would send the file to a secure server endpoint instead.
  clear(userId) {
    try { localStorage.removeItem(this._key(userId)); } catch(e) {}
  }
};

// ─── HELPERS ──────────────────────────────────────────────────────────────────

function displayName(user) {
  if (!user) return 'Unknown';
  return (user.firstName + ' ' + user.lastName).trim();
}

function nameLink(user, extraStyle) {
  if (!user) return '<span style="color:var(--muted)">Unknown</span>';
  const style = extraStyle ? ` style="${extraStyle}"` : '';
  return `<a class="name-link"${style} onclick="navigate('profile','${user.id}');return false" href="#">${esc(displayName(user))}</a>`;
}

function initials(user) {
  if (!user) return '?';
  return ((user.firstName||'')[0]||'') + ((user.lastName||'')[0]||'');
}

// ─── AUTH ─────────────────────────────────────────────────────────────────────

let currentUser = null;

// getAuthUser() re-derives the authenticated user fresh from the session token
// on every call. All write operations must use this rather than trusting the
// currentUser variable, which could be tampered with via the browser console.
function getAuthUser() {
  const uid = localStorage.getItem('saloon_session');
  if (!uid) return null;
  return DB.users.find(u => u.id === uid) || null;
}

function loadSession() {
  currentUser = getAuthUser();
}

function login(email, password) {
  // Local mode: validate against hashed password in DB
  const u = DB.users.find(u => u.email.toLowerCase() === email.toLowerCase().trim());
  if (!u) return 'No account found with that email.';
  if (!checkPassword(password, u.passwordHash)) return 'Incorrect password.';
  currentUser = u;
  localStorage.setItem('saloon_session', u.id);
  return null;
}

// Backend-aware login used by the login form submit handler
async function loginAsync(email, password) {
  if (!BACKEND_URL) return login(email, password); // fall back to local
  try {
    const res = await apiCall('POST', '/api/auth/login', { email, password });
    // Merge server user into local DB
    const idx = DB.users.findIndex(u => u.id === res.user.id);
    if (idx >= 0) DB.users[idx] = res.user; else DB.users.push(res.user);
    DB.save();
    currentUser = res.user;
    localStorage.setItem('saloon_session', res.user.id);
    localStorage.setItem('saloon_jwt', res.token);
    return null;
  } catch(e) { return e.message; }
}

function logout() {
  currentUser = null;
  localStorage.removeItem('saloon_session');
  localStorage.removeItem('saloon_jwt');
  // Drop the moderation queue and any elevation. The queue holds every user's
  // email and ID filename, and the step-up token stays valid for its remaining
  // window — neither should outlive the session that fetched them.
  adminUsers  = null;
  adminStepUp = null;
  adminTab    = 'pending';
  adminSearch = '';
  navigate('home');
}

function register(firstName, lastName, email, password, idFile, idFileName) {
  if (!firstName || firstName.length < 1) return 'Please enter your first name.';
  if (!lastName || lastName.length < 1) return 'Please enter your last name.';
  if (!email || !email.includes('@')) return 'Please enter a valid email address.';
  if (DB.users.find(u => u.email.toLowerCase() === email.toLowerCase().trim()))
    return 'An account with that email already exists.';
  if (password.length < 6) return 'Password must be at least 6 characters.';
  if (!idFile) return 'Please upload a valid photo ID.';
  // Zero out the in-memory variable immediately after validation — it will go to IDSTORE only

  const u = {
    id: DB.uid(),
    firstName: firstName.trim(),
    lastName: lastName.trim(),
    email: email.toLowerCase().trim(),
    passwordHash: hashPassword(password),
    idFileName,           // filename only — never store the raw image in the user record
    idSubmitted: true,    // flag that ID was provided; actual file is in IDSTORE
    verified: false,
    createdAt: Date.now()
  };
  // Store the ID image completely separately, isolated from the main DB object
  IDSTORE.set(u.id, idFile);
  DB.users.push(u);
  // Auto-join any conversations this email was invited to
  const pending = (DB.invitations || []).filter(i => i.email === u.email);
  pending.forEach(inv => {
    const c = DB.conversations.find(c => c.id === inv.convId);
    if (c && !(c.participants || []).includes(u.id)) c.participants.push(u.id);
  });
  DB.invitations = (DB.invitations || []).filter(i => i.email !== u.email);
  DB.save();
  currentUser = u;
  localStorage.setItem('saloon_session', u.id);
  return null;
}

function hashPassword(pw) {
  let h = 0;
  for (let i = 0; i < pw.length; i++) h = ((h << 5) - h) + pw.charCodeAt(i);
  return (h >>> 0).toString(36) + pw.length.toString(36) + pw.charCodeAt(0).toString(36);
}
function checkPassword(pw, hash) { return hashPassword(pw) === hash; }

// ─── ENGAGEMENT ALGORITHM ─────────────────────────────────────────────────────

const _scoreCache = new Map();

function engagementScore(conv) {
  if (_scoreCache.has(conv.id)) return _scoreCache.get(conv.id);
  const posts = DB.posts.filter(p => p.conversationId === conv.id);
  const comments = DB.comments.filter(c => c.conversationId === conv.id);
  const lastTs = Math.max(conv.createdAt, ...posts.map(p => p.createdAt), ...comments.map(c => c.createdAt), 0);
  const hoursAgo = (Date.now() - lastTs) / 3600000;
  const recencyBoost = Math.exp(-hoursAgo / 72) * 25;
  const netVotes = (conv.likes || []).length - (conv.dislikes || []).length;
  const score = netVotes * 3 + posts.length * 4 + comments.length * 2 + (conv.viewCount || 0) * 0.08 + recencyBoost;
  _scoreCache.set(conv.id, score);
  return score;
}

// ─── ROUTER ───────────────────────────────────────────────────────────────────

let currentPage = 'home';
let currentConvId = null;
let navStack = [];

function _setHash(page, id) {
  const h = '#' + page + (id ? '/' + id : '');
  if (location.hash !== h) location.hash = h;
}

// Every page id, in one place. This list was previously duplicated in four
// separate literals and they had already drifted apart.
const PAGES = ['home','login','register','conversation','profile','reset','draft','admin'];

function navigate(page, id) {
  // Push current location onto the back-stack before leaving
  if (currentPage) navStack.push({ page: currentPage, id: currentConvId });
  if (navStack.length > 20) navStack.shift();
  currentPage = page;
  currentConvId = id || null;
  _setHash(page, id);
  PAGES.forEach(p => {
    document.getElementById('page-' + p).style.display = 'none';
  });
  const target = document.getElementById('page-' + page);
  if (target) { target.style.display = ''; renderPage(page, id); }
  window.scrollTo(0, 0);
  renderNav();
}

function navigateBack() {
  const prev = navStack.pop();
  if (!prev) { navigate('home'); return; }
  currentPage = prev.page;
  currentConvId = prev.id || null;
  _setHash(prev.page, prev.id);
  PAGES.forEach(p => {
    document.getElementById('page-' + p).style.display = 'none';
  });
  const target = document.getElementById('page-' + currentPage);
  if (target) { target.style.display = ''; renderPage(currentPage, currentConvId); }
  window.scrollTo(0, 0);
  renderNav();
}

function parseHash() {
  const h = location.hash.replace('#', '');
  if (!h || h === 'home') return { page: 'home', id: null };
  const [page, id] = h.split('/');
  const valid = PAGES;
  return valid.includes(page) ? { page, id: id || null } : { page: 'home', id: null };
}

window.addEventListener('hashchange', function() {
  const { page, id } = parseHash();
  if (page === currentPage && id === currentConvId) return;
  navigate(page, id);
});

function copyConvLink() {

// A quiet placeholder for the window before the first fetch resolves. Not a
// spinner in an empty page: it keeps the chrome and reserves the space the real
// content will occupy.
function renderLoadingPage(elId, label) {

// Re-render once real data arrives. Deliberately not a blind navigate(): that
// would push a bogus history entry and destroy anything the user has typed.
// Pages backed by an uncontrolled input are skipped entirely.
function hydrateAfterLoad() {
  const page = currentPage, id = currentConvId;
  if (page === 'home') { renderHome(); }
  else if (page === 'profile') { renderProfile(id); }
  else if (page === 'admin') { renderAdmin(); }
  else if (page === 'conversation') {
    // Skip the re-render while an editor is open, or unsaved text would vanish.
    // The underlying data is already fresh; the DOM catches up on the next
    // interaction. Tracking still runs: the person read the page either way.
    if (!editingPostId && !editingSourcesPostId && !editingTitle && !editingCategory) {
      renderConversation(id);
    }
    if (backendReady) trackView(id);
  }
  // login / register / reset / draft hold in-progress input and are never
  // re-rendered from under the user.
  renderNav();
}

function renderPage(page, id) {
  switch(page) {
    case 'home': renderHome(); break;
    case 'login': renderLogin(); break;
    case 'register': renderRegister(); break;
    case 'conversation': renderConversation(id); if(backendReady) trackView(id); break;
    case 'profile': renderProfile(id); break;
    case 'reset': renderResetPassword(id); break;
    case 'draft': renderDraftSandbox(id); break;
    case 'admin': renderAdmin(); break;
  }
}

const GOOGLE_CLIENT_ID = '233389892795-7nklhha46ahv3odsn0uk0lu69qcogakb.apps.googleusercontent.com';

function startGoogleAuth() {
  if (typeof google === 'undefined') { toast('Google Sign-In not loaded yet. Please try again.'); return; }
  google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'openid email profile',
    callback: () => {}
  });
  // Use the ID token flow via prompt
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleCredential,
    auto_select: false,
    cancel_on_tap_outside: true,
  });
  google.accounts.id.prompt(notification => {
    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
      // Fallback: render a button in an overlay
      showGooglePopup();
    }
  });
}

function showGooglePopup() {
  const overlay = document.createElement('div');
  overlay.id = 'google-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center';
  overlay.innerHTML = '<div style="background:#fff;border-radius:12px;padding:32px;text-align:center;min-width:280px"><p style="font-family:sans-serif;margin-bottom:16px;color:#333">Sign in with your Google account</p><div id="google-btn-container"></div><br><button onclick="document.getElementById(\'google-popup-overlay\').remove()" style="font-family:sans-serif;font-size:13px;color:#888;background:none;border:none;cursor:pointer">Cancel</button></div>';
  document.body.appendChild(overlay);
  google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
  google.accounts.id.renderButton(document.getElementById('google-btn-container'), { theme: 'outline', size: 'large', width: 240 });
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

async function handleGoogleCredential(response) {
  const overlay = document.getElementById('google-popup-overlay');
  if (overlay) overlay.remove();
  try {
    const res = await apiCall('POST', '/api/auth/google', { credential: response.credential });
    if (res.needsRegistration) {
      // New Google user — show registration form pre-filled
      pendingGoogleCredential = response.credential;
      pendingGoogleEmail = res.email;
      navigate('register');
      // Pre-fill email after render
      setTimeout(() => {
        const emailEl = document.getElementById('reg-email');
        if (emailEl) { emailEl.value = res.email; emailEl.readOnly = true; }
      }, 50);
      toast('Welcome! Please complete your registration and upload your ID.');
    } else {
      // Existing verified Google user
      currentUser = res.user;
      localStorage.setItem('saloon_session', res.user.id);
      localStorage.setItem('saloon_jwt', res.token);
      const idx = DB.users.findIndex(u => u.id === res.user.id);
      if (idx >= 0) DB.users[idx] = res.user; else DB.users.push(res.user);
      DB.save();
      renderNav();
      navigate('home');
      toast('Welcome back, ' + displayName(currentUser) + '!');
    }
  } catch(e) {
    toast('Google sign-in failed: ' + e.message);
  }
}

async function doResetPassword(token) {
  const pw = document.getElementById('reset-pw').value;
  const pw2 = document.getElementById('reset-pw2').value;
  const msg = document.getElementById('reset-msg');
  if (pw.length < 6) { msg.style.color='var(--danger)'; msg.textContent='Password must be at least 6 characters.'; msg.style.display=''; return; }
  if (pw !== pw2) { msg.style.color='var(--danger)'; msg.textContent='Passwords do not match.'; msg.style.display=''; return; }
  const btn = document.querySelector('#page-reset .btn-primary');
  if (btn) btn.disabled = true;
  try {
    const res = await apiCall('POST', '/api/auth/reset-password', { token, password: pw });
    currentUser = res.user;
    localStorage.setItem('saloon_session', res.user.id);
    localStorage.setItem('saloon_jwt', res.token);
    history.replaceState(null, '', location.pathname);
    renderNav();
    navigate('home');
    toast('Password updated. Welcome back, ' + displayName(currentUser) + '.');
  } catch(e) {
    msg.style.color='var(--danger)'; msg.textContent=e.message; msg.style.display='';
    if (btn) btn.disabled = false;
  }
}

function handleIdUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('id-upload-area').classList.add('has-file');
  document.getElementById('id-upload-label').textContent = '✓ ' + file.name;
  const reader = new FileReader();
  reader.onload = ev => { pendingIdFile = ev.target.result; pendingIdFileName = file.name; };
  reader.readAsDataURL(file);
}

async function doRegister() {
  const firstName = document.getElementById('reg-firstname').value.trim();
  const lastName = document.getElementById('reg-lastname').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const password2 = document.getElementById('reg-password2').value;
  const errEl = document.getElementById('reg-error');
  const btn = document.querySelector('#page-register .btn-primary');

  if (BACKEND_URL) {
    // Backend mode: validate locally first, then call server
    if (!firstName) { errEl.textContent = 'Please enter your first name.'; errEl.style.display = ''; return; }
    if (!lastName)  { errEl.textContent = 'Please enter your last name.';  errEl.style.display = ''; return; }
    if (!email || !email.includes('@')) { errEl.textContent = 'Please enter a valid email.'; errEl.style.display = ''; return; }
    if (!pendingGoogleCredential) {
      if (password.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.style.display = ''; return; }
      if (password !== password2) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = ''; return; }
    }
    if (!pendingIdFile) { errEl.textContent = 'Please upload a valid photo ID.'; errEl.style.display = ''; return; }
    if (btn) btn.disabled = true;
    try {
      const res = await apiCall('POST', '/api/auth/register', {
        firstName, lastName, email,
        ...(pendingGoogleCredential ? { googleCredential: pendingGoogleCredential } : { password }),
        idFileName: pendingIdFileName || ''
      });
      // Store ID image locally in IDSTORE (never sent to server in full)
      IDSTORE.set(res.user.id, pendingIdFile);
      pendingIdFile = null;
      pendingGoogleCredential = null;
      pendingGoogleEmail = null;
      const idx = DB.users.findIndex(u => u.id === res.user.id);
      if (idx >= 0) DB.users[idx] = res.user; else DB.users.push(res.user);
      DB.save();
      // Show appropriate post-registration screen
      if (res.emailVerificationRequired) {
        pendingVerifyEmail = res.user.email;
        document.getElementById('page-register').innerHTML = `
          <div class="container">
            <div class="auth-card" style="max-width:480px;text-align:center">
              <div style="font-size:48px;margin-bottom:16px">📬</div>
              <h2>Check your email</h2>

            </div>
          </div>
        `;
      } else {
        document.getElementById('page-register').innerHTML = `
          <div class="container">
            <div class="auth-card" style="max-width:480px;text-align:center">
              <div style="font-size:48px;margin-bottom:16px">🪪</div>
              <h2>ID submitted</h2>
              <p class="auth-sub" style="margin-bottom:16px">Your ID is pending review by an admin. You'll be able to participate once approved.</p>
            </div>
          </div>
        `;
      }
    } catch(e) {
      errEl.textContent = e.message; errEl.style.display = '';
    }
    if (btn) btn.disabled = false;
  } else {
    // Local mode
    const err = register(firstName, lastName, email, password, pendingIdFile, pendingIdFileName);
    if (err) {
      errEl.textContent = err; errEl.style.display = '';
    } else {
      pendingIdFile = null;
      renderNav();
      navigate('home');
      toast('Welcome to Saloon, ' + displayName(currentUser) + '. Your ID is pending review.');
    }
  }
}

function trackView(id) {
  if (!id || !BACKEND_URL) return;
  const viewKey = 'viewed_' + id;
  if (sessionStorage.getItem(viewKey)) return;
  sessionStorage.setItem(viewKey, '1');
  fetch(BACKEND_URL + '/api/conversations/' + id + '/view', { method: 'POST' })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data && data.viewCount !== undefined) {
        const c = DB.conversations.find(x => x.id === id);
        if (c) { c.viewCount = data.viewCount; DB.save(); renderConversation(id); }
      }
    })
    .catch(() => {});
}

let pendingVerifyEmail = '';
const ADMIN_EMAIL = 'akassin101@gmail.com';
// Mirrors EDIT_WINDOW_MS in server.js. The server is authoritative; this only
// decides whether the UI offers the control. Keep the two in sync.
const EDIT_WINDOW_MS = 24 * 60 * 60 * 1000;
// Prefer the flag the server derived from the stored account; fall back to the
// email for offline/local mode. Either way this only controls what the UI
// offers — the server re-checks every privileged action.
function isAdmin() { const u = getAuthUser(); return !!u && (u.isAdmin === true || u.email === ADMIN_EMAIL); }

// ─── ADMIN (site owner) ───────────────────────────────────────────────────────
// The moderation queue, usable from the live site while signed in as the owner.
//
// This data carries email addresses and ID-document filenames. It is held in a
// plain variable and deliberately NEVER written into DB or localStorage — the
// cached database is PII-free by design and must stay that way.
let adminUsers  = null;
let adminTab    = 'pending';
let adminSearch = '';
// Step-up confirmation for irreversible actions. Memory only, never persisted:
// the whole point is that it is out of reach of injected script on a later load.
let adminStepUp = null;

async function loadAdminUsers() {
  try {
    adminUsers = await apiCall('GET', '/api/moderation/users');
  } catch (e) {
    adminUsers = [];
    toast(e.message || 'Could not load the moderation queue.');
  }
}

function adminFiltered() {
  let list = (adminUsers || []).slice();
  if (adminTab === 'pending')  list = list.filter(u => u.idSubmitted && !u.verified);
  if (adminTab === 'verified') list = list.filter(u => u.verified);
  const q = adminSearch.trim().toLowerCase();
  if (q) list = list.filter(u => (u.firstName + ' ' + u.lastName + ' ' + u.email).toLowerCase().includes(q));
  return list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
}

function renderAdminRow(u) {
  const badge = u.verified   ? '<span class="badge verified">Verified</span>'
              : u.idSubmitted ? '<span class="badge pending">ID pending</span>'
              : u.idRejected  ? '<span class="badge rejected">Rejected</span>' : '';
  const review = u.idSubmitted && !u.verified
    ? `<button class="btn-primary btn-sm" onclick="adminVerify('${u.id}')">Verify</button>
       <button class="btn-ghost btn-sm" onclick="adminReject('${u.id}')">Reject</button>`
    : '';
  return `
    <div class="follow-row">
      <div class="follow-info">
        <div class="follow-name" onclick="navigate('profile','${u.id}')">${esc(displayName(u))} ${badge}</div>
        <div class="follow-bio">
          ${esc(u.email)}${u.emailVerified ? '' : ' &middot; email unconfirmed'}
          ${u.idFileName ? ' &middot; ID: ' + esc(u.idFileName) : ''}
          &middot; joined ${timeAgo(u.createdAt)}
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
        ${review}
        <button class="btn-ghost btn-sm" style="color:#c0392b" onclick="adminDelete('${u.id}')">Delete</button>
      </div>
    </div>`;
}

function renderAdminList() {
  const box = document.getElementById('admin-list');
  if (!box) return;
  const list = adminFiltered();
  box.innerHTML = list.length
    ? list.map(renderAdminRow).join('')
    : `<div class="empty-state" style="padding:40px 0"><div class="empty-icon">&#10022;</div><h3>Nobody here</h3></div>`;
}

async function renderAdmin() {
  const el = document.getElementById('page-admin');
  // Checked again on every render, not just at the nav link, so a hand-typed
  // #admin hash gets nothing. The server re-checks independently regardless.
  if (!isAdmin()) { navigate('home'); return; }

  if (adminUsers === null) {
    el.innerHTML = `<div class="container"><p style="color:var(--muted);font-family:var(--font-ui)">Loading&hellip;</p></div>`;
    await loadAdminUsers();
    if (currentPage !== 'admin') return; // navigated away while loading
  }

  const all      = adminUsers || [];
  const pending  = all.filter(u => u.idSubmitted && !u.verified).length;
  const verified = all.filter(u => u.verified).length;
  const tabs = { pending: 'Pending (' + pending + ')', verified: 'Verified (' + verified + ')', all: 'All (' + all.length + ')' };

  el.innerHTML = `
    <div class="container">
      <div style="margin-bottom:20px">
        <a href="#" onclick="navigateBack();return false" style="font-family:var(--font-ui);font-size:13px;color:var(--muted)">&larr; Back</a>
      </div>
      <div class="page-header">
        <h1>Admin</h1>
        <p>Review identity submissions and manage accounts.</p>
      </div>
      <div class="profile-tabs">
        ${Object.keys(tabs).map(t => `<div class="profile-tab ${adminTab===t?'active':''}" onclick="setAdminTab('${t}')">${tabs[t]}</div>`).join('')}
      </div>
      <input id="admin-search" type="search" placeholder="Search by name or email&hellip;"
        value="${esc(adminSearch)}" oninput="setAdminSearch(this.value)"
        style="width:100%;margin:14px 0;padding:10px 12px">
      <div id="admin-list"></div>
    </div>`;
  renderAdminList();
}

function setAdminTab(tab) {
  adminTab = tab;
  renderAdmin();
}

// Only the list is re-rendered, so the search field keeps focus while typing.
function setAdminSearch(value) {
  adminSearch = value;
  renderAdminList();
}

async function adminVerify(userId) {
  if (!isAdmin()) return;
  try {
    const updated = await apiCall('PATCH', '/api/moderation/users/' + userId + '/verify');
    adminApplyUpdate(updated);
    toast('Verified.');
  } catch (e) { toast(e.message || 'Could not verify that account.'); }
}

async function adminReject(userId) {
  if (!isAdmin()) return;
  if (!confirm('Reject this ID submission? They will need to submit again.')) return;
  try {
    const updated = await apiCall('PATCH', '/api/moderation/users/' + userId + '/reject');
    adminApplyUpdate(updated);
    toast('Rejected.');
  } catch (e) { toast(e.message || 'Could not reject that submission.'); }
}

function adminApplyUpdate(updated) {
  if (!updated || !updated.id) return;
  const i = (adminUsers || []).findIndex(u => u.id === updated.id);
  if (i !== -1) adminUsers[i] = updated;
  // Keep the public cache's verified flag in step, without ever copying the
  // email or ID filename into it.
  const cached = DB.users.find(u => u.id === updated.id);
  if (cached) { cached.verified = updated.verified; cached.idSubmitted = updated.idSubmitted; DB.save(); }
  renderAdmin();
}

// Deleting an account is irreversible and cascades, so it needs the admin key
// even though you are already signed in. One confirmation covers five minutes.
async function ensureStepUp() {
  if (adminStepUp && adminStepUp.expires > Date.now() + 5000) return adminStepUp.token;
  const key = prompt('Deleting an account is permanent and removes their conversations, posts and comments.\n\nEnter the admin key to confirm. This unlocks deletions for 5 minutes.');
  if (!key) return null;
  try {
    const res = await apiCall('POST', '/api/moderation/elevate', { adminKey: key });
    adminStepUp = { token: res.token, expires: Date.now() + (res.expiresIn * 1000) };
    return adminStepUp.token;
  } catch (e) {
    toast(e.message || 'Could not confirm the admin key.');
    return null;
  }
}

async function adminDelete(userId) {
  if (!isAdmin()) return;
  const u = (adminUsers || []).find(x => x.id === userId);
  const who = u ? displayName(u) : 'this account';
  if (!confirm('Permanently delete ' + who + ', and all their conversations, posts and comments?')) return;
  const token = await ensureStepUp();
  if (!token) return;
  try {
    await apiCall('DELETE', '/api/moderation/users/' + userId, null, { 'x-step-up': token });
  } catch (e) {
    if (e.message && /expired|admin key/i.test(e.message)) adminStepUp = null;
    toast(e.message || 'Could not delete that account.');
    return;
  }
  adminUsers = (adminUsers || []).filter(x => x.id !== userId);
  DB.users = DB.users.filter(x => x.id !== userId);
  DB.save();
  toast(who + ' deleted.');
  renderAdmin();
}

function renderPost(post, convId) {
  const author = DB.users.find(u => u.id === post.authorId);
  const conv = DB.conversations.find(c => c.id === post.conversationId);
  const participants = new Set((conv && conv.participants) || []);
  const postComments = DB.comments.filter(c => c.postId === post.id).sort((a,b) => {
    const aPoster = participants.has(a.authorId) ? 0 : 1;
    const bPoster = participants.has(b.authorId) ? 0 : 1;
    return aPoster - bPoster || a.createdAt - b.createdAt;
  });
  const withinEditWindow = currentUser && currentUser.id === post.authorId
    && (Date.now() - (post.publishedAt || post.createdAt)) < EDIT_WINDOW_MS;
  const editing = (isAdmin() || withinEditWindow) && editingPostId === post.id;
  const editingSources = currentUser && currentUser.id === post.authorId && editingSourcesPostId === post.id;
  const showingHistory = viewingHistoryPostId === post.id;
  const hasEdits = post.edits && post.edits.length > 0;

  const authorLine = `
    <div class="post-author">
      <span>${nameLink(author, 'font-weight:500')} · ${timeAgo(post.createdAt)}${hasEdits ? ` · <button class="post-action-btn" style="font-style:italic;opacity:.7" onclick="viewingHistoryPostId=viewingHistoryPostId==='${post.id}'?null:'${post.id}';renderConversation('${convId}')">edited</button>` : ''}</span>
      <div style="display:flex;gap:6px;align-items:center">
        ${(isAdmin() || withinEditWindow) && !editing ? `<button class="post-action-btn" style="opacity:.5" onclick="editingPostId='${post.id}';renderConversation('${convId}')">edit</button>` : ''}
        ${withinEditWindow && !editing ? `<button class="post-action-btn" style="opacity:.5;color:#c0392b" onclick="deleteOwnPost('${post.id}','${convId}')">delete</button>` : ''}
        ${currentUser ? `<button class="post-action-btn" onclick="openAnnotateModal('${post.id}','${convId}',null)">◎ comment</button>` : ''}
      </div>
    </div>
  `;

  let contentHtml;
  if (editing) {
    contentHtml = `
      <textarea id="post-edit-textarea" style="width:100%;min-height:120px;padding:12px;border:1px solid var(--border);border-radius:4px;font-family:var(--font-body);font-size:15px;line-height:1.7;background:var(--bg);color:var(--text);resize:vertical;margin-bottom:8px">${esc(post.content)}</textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn-ghost btn-sm" onclick="editingPostId=null;renderConversation('${convId}')">Cancel</button>
        <button class="btn-primary btn-sm" onclick="savePostEdit('${post.id}','${convId}')">Save</button>
      </div>`;
  } else {
    const sourcesHtml = post.sources && post.sources.length > 0 ? `
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border)">
        <div style="font-family:var(--font-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Sources</div>
        <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
          ${post.sources.map(s => { const u = safeUrl(s.url); return `<li style="font-family:var(--font-ui);font-size:13px">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">${esc(s.label)}</a>` : esc(s.label)}</li>`; }).join('')}
        </ol>
      </div>` : '';
    const historyHtml = showingHistory && hasEdits ? `
      <div style="margin-top:14px;padding:14px;border:1px solid var(--border);border-radius:4px;background:var(--bg)">
        <div style="font-family:var(--font-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px">Edit history</div>
        ${post.edits.slice().reverse().map((e, i) => `
          <div style="margin-bottom:${i < post.edits.length-1 ? '14px' : '0'};padding-bottom:${i < post.edits.length-1 ? '14px' : '0'};border-bottom:${i < post.edits.length-1 ? '1px solid var(--border)' : 'none'}">
            <div style="font-family:var(--font-ui);font-size:11px;color:var(--muted);margin-bottom:6px">${timeAgo(e.editedAt)}</div>
            <div style="font-family:var(--font-body);font-size:14px;line-height:1.7;color:var(--muted);white-space:pre-wrap">${esc(e.content)}</div>
          </div>`).join('')}
      </div>` : '';
    contentHtml = `<div class="post-content" id="post-content-${post.id}">${renderAnnotatedContent(post.content, postComments)}</div>${sourcesHtml}${historyHtml}`;
  }

  let inner;
  if (commentView === 'sidebar') {
    const sidebarContent = postComments.length > 0
      ? postComments.map(renderAnnotationBubble).join('')
      : `<span class="post-sidebar-empty">no annotations</span>`;
    inner = `
      <div class="post-split">
        <div class="post-main">${authorLine}${contentHtml}</div>
        <div class="post-sidebar">${sidebarContent}</div>
      </div>
    `;
  } else if (commentView === 'hidden') {
    inner = `${authorLine}${contentHtml}`;
  } else {
    // inline (default)
    inner = `
      ${authorLine}
      ${contentHtml}
      ${!editing ? `
        <div class="post-actions">
          ${postComments.length > 0 ? `<span style="font-family:var(--font-ui);font-size:12px;color:var(--muted)">◎ ${postComments.length} comment${postComments.length!==1?'s':''}</span>` : ''}
          ${currentUser && currentUser.id === post.authorId && !editingSources ? `<button class="post-action-btn" onclick="editingSourcesPostId='${post.id}';renderConversation('${convId}')">+ source</button>` : ''}
        </div>
        ${editingSources ? renderSourceEditor(post, convId) : ''}
        ${postComments.length > 0 ? `<div style="margin-top:12px">${postComments.map(renderAnnotationBubble).join('')}</div>` : ''}
      ` : ''}
    `;
  }

  return `<div class="post" id="post-${post.id}" data-post-id="${post.id}" data-conv-id="${convId}">${inner}</div>`;
}

function renderAnnotatedContent(content, annotations) {
  let result = esc(content);
  const used = new Set();
  annotations.forEach(ann => {
    if (!ann.selectedText || used.has(ann.selectedText)) return;
    const escapedSel = esc(ann.selectedText);
    if (result.includes(escapedSel)) {
      result = result.replace(escapedSel, `<span class="annotated" title="Has annotation">${escapedSel}</span>`);
      used.add(ann.selectedText);
    }
  });
  return result;
}

function renderAnnotationBubble(ann) {
  const author = DB.users.find(u => u.id === ann.authorId);
  return `
    <div class="annotation-bubble">
      ${ann.selectedText ? `<div class="quoted-text">"${esc(ann.selectedText)}"</div>` : ''}
      <div>${esc(ann.content)}</div>
      <div class="ann-meta">${nameLink(author)} · ${timeAgo(ann.createdAt)}</div>
    </div>
  `;
}

function renderCommentItem(c) {
  const author = DB.users.find(u => u.id === c.authorId);
  return `
    <div class="comment-item">
      <div class="comment-meta">
        ${nameLink(author)} · ${timeAgo(c.createdAt)}
      </div>
      ${c.selectedText ? `<div class="comment-quoted">"${esc(c.selectedText)}"</div>` : ''}
      <div class="comment-content">${esc(c.content)}</div>
    </div>
  `;
}

// ─── TEXT SELECTION → ANNOTATION ──────────────────────────────────────────────

let selectionData = null;
let _selectionAbort = null;

function setupTextSelection(convId) {
  // Abort any prior listener so we never accumulate multiple mouseup handlers
  if (_selectionAbort) _selectionAbort.abort();
  _selectionAbort = new AbortController();
  const { signal } = _selectionAbort;

  const trigger = document.getElementById('annotation-trigger');

  document.addEventListener('mouseup', function(e) {
    if (currentPage !== 'conversation') { trigger.style.display = 'none'; return; }
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.toString().trim()) {
      trigger.style.display = 'none'; selectionData = null; return;
    }
    const selectedText = sel.toString().trim();
    if (!selectedText || selectedText.length < 2) { trigger.style.display = 'none'; return; }

    let postEl = null;
    let node = sel.anchorNode;
    while (node) {
      if (node.dataset && node.dataset.postId) { postEl = node; break; }
      node = node.parentElement;
    }
    if (!postEl) {
      try {
        let container = sel.getRangeAt(0).commonAncestorContainer;
        while (container) {
          if (container.dataset && container.dataset.postId) { postEl = container; break; }
          container = container.parentElement;
        }
      } catch(e) {}
    }

    if (!currentUser) { trigger.style.display = 'none'; return; }

    const rect = sel.getRangeAt(0).getBoundingClientRect();
    trigger.style.display = 'block';
    trigger.style.top = (window.scrollY + rect.bottom + 8) + 'px';
    trigger.style.left = (rect.left + rect.width / 2 - 70) + 'px';
    selectionData = { selectedText, postId: postEl ? postEl.dataset.postId : null, convId };
  }, { signal });

  trigger.onclick = () => {
    if (!selectionData) return;
    trigger.style.display = 'none';
    openAnnotateModal(selectionData.postId, selectionData.convId, selectionData.selectedText);
    window.getSelection().removeAllRanges();
  };
}

// ─── COMMENT MODAL ────────────────────────────────────────────────────────────

let commentModalData = null;

function openAnnotateModal(postId, convId, selectedText) {
  if (!currentUser) { navigate('login'); return; }
  commentModalData = { postId, convId, selectedText };

  document.getElementById('comment-modal-title').textContent =
    postId ? (selectedText ? 'Annotate selection' : 'Comment on post') : 'Comment on conversation';

  const ctx = document.getElementById('comment-context-display');
  if (selectedText) {
    ctx.innerHTML = `<div class="comment-context-box">"${esc(selectedText)}"</div>`;
  } else if (postId) {
    const post = DB.posts.find(p => p.id === postId);
    const snippet = post ? post.content.slice(0, 100) + (post.content.length > 100 ? '…' : '') : '';
    ctx.innerHTML = `<div class="comment-context-box" style="font-style:normal;font-size:13px">"${esc(snippet)}"</div>`;
  } else {
    ctx.innerHTML = '';
  }

  document.getElementById('comment-input').value = '';
  document.getElementById('comment-modal').classList.add('open');
  setTimeout(() => document.getElementById('comment-input').focus(), 50);
}

function closeCommentModal() {
  document.getElementById('comment-modal').classList.remove('open');
  commentModalData = null;
}

function submitComment() {
  const auth = getAuthUser();
  if (!auth || !commentModalData) return;
  const content = document.getElementById('comment-input').value.trim();
  if (!content) { toast('Please write a comment.'); return; }

  // Save before closeCommentModal() nulls commentModalData
  const { convId, postId, selectedText } = commentModalData;
  const comment = { id: DB.uid(), conversationId: convId, postId: postId||null, authorId: auth.id, selectedText: selectedText||null, content, createdAt: Date.now() };
  DB.comments.push(comment);
  DB.save();
  bw('POST', '/api/comments', comment);
  closeCommentModal();
  toast('Comment posted.');
  renderConversation(convId);
}

// ─── SUBMIT POST ──────────────────────────────────────────────────────────────

let sourceCount = 0;
function addSourceField() {
  const list = document.getElementById('sources-list');
  if (!list) return;
  list.style.display = 'block';
  const n = ++sourceCount;
  const row = document.createElement('div');
  row.id = 'source-row-' + n;
  row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px';
  row.innerHTML = `
    <span style="font-family:var(--font-ui);font-size:12px;color:var(--muted);min-width:16px">${n}.</span>
    <input placeholder="Label (optional)" style="flex:0 0 140px;padding:5px 8px;border:1px solid var(--border);border-radius:3px;font-family:var(--font-ui);font-size:13px;background:var(--bg);color:var(--text)" id="src-label-${n}">
    <input placeholder="URL (optional)" style="flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:3px;font-family:var(--font-ui);font-size:13px;background:var(--bg);color:var(--text)" id="src-url-${n}">
    <button class="btn-ghost btn-sm" style="padding:4px 8px;font-size:12px;color:var(--muted)" onclick="document.getElementById('source-row-${n}').remove()">✕</button>
  `;
  list.appendChild(row);
}

function collectSources() {
  const sources = [];
  document.querySelectorAll('[id^="source-row-"]').forEach(row => {
    const n = row.id.replace('source-row-', '');
    const url = (document.getElementById('src-url-' + n)||{}).value?.trim();
    const label = (document.getElementById('src-label-' + n)||{}).value?.trim();
    if (url || label) sources.push({ url: url || '', label: label || url || '' });
  });
  return sources;
}

function submitPost(convId) {
  const auth = getAuthUser();
  if (!auth) { navigate('login'); return; }
  const content = document.getElementById('post-compose').value.trim();
  if (!content) { toast('Write something first.'); return; }

  const conv = DB.conversations.find(c => c.id === convId);
  if (!conv || !(conv.participants||[]).includes(auth.id)) {
    toast('You are not a participant in this conversation.'); return;
  }

  const sources = collectSources();
  const post = { id: DB.uid(), conversationId: convId, authorId: auth.id, content, sources, createdAt: Date.now() };
  DB.posts.push(post);
  conv.lastActivity = Date.now();
  DB.save();
  bw('POST', '/api/posts', post);
  sourceCount = 0;
  toast('Contributed.');
  renderConversation(convId);
}

function renderSourceEditor(post, convId) {
  const existing = (post.sources || []).map((s, i) => `
    <div id="src-edit-row-${i}" style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <span style="font-family:var(--font-ui);font-size:12px;color:var(--muted);min-width:16px">${i+1}.</span>
      <input id="src-edit-label-${i}" placeholder="Label (optional)" value="${esc(s.label === s.url ? '' : s.label)}" style="flex:0 0 140px;padding:5px 8px;border:1px solid var(--border);border-radius:3px;font-family:var(--font-ui);font-size:13px;background:var(--bg);color:var(--text)">
      <input id="src-edit-url-${i}" placeholder="URL (optional)" value="${esc(s.url)}" style="flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:3px;font-family:var(--font-ui);font-size:13px;background:var(--bg);color:var(--text)">
      <button class="btn-ghost btn-sm" style="padding:4px 8px;font-size:12px;color:var(--muted)" onclick="document.getElementById('src-edit-row-${i}').remove()">✕</button>
    </div>`).join('');
  return `
    <div id="source-editor-${post.id}" style="margin-top:12px;padding:14px;border:1px solid var(--border);border-radius:4px;background:var(--bg)">
      <div style="font-family:var(--font-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px">Edit sources</div>
      <div id="src-edit-list-${post.id}">${existing}</div>
      <button class="btn-ghost btn-sm" style="font-size:12px;margin-bottom:12px" onclick="addSourceEditField('${post.id}')">+ Add source</button>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn-ghost btn-sm" onclick="editingSourcesPostId=null;renderConversation('${convId}')">Cancel</button>
        <button class="btn-primary btn-sm" onclick="savePostSources('${post.id}','${convId}')">Save sources</button>
      </div>
    </div>`;
}

let srcEditCount = 1000;
function addSourceEditField(postId) {
  const list = document.getElementById('src-edit-list-' + postId);
  if (!list) return;
  const n = ++srcEditCount;
  const row = document.createElement('div');
  row.id = 'src-edit-row-' + n;
  row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px';
  row.innerHTML = `
    <span style="font-family:var(--font-ui);font-size:12px;color:var(--muted);min-width:16px">·</span>
    <input id="src-edit-label-${n}" placeholder="Label (optional)" style="flex:0 0 140px;padding:5px 8px;border:1px solid var(--border);border-radius:3px;font-family:var(--font-ui);font-size:13px;background:var(--bg);color:var(--text)">
    <input id="src-edit-url-${n}" placeholder="URL (optional)" style="flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:3px;font-family:var(--font-ui);font-size:13px;background:var(--bg);color:var(--text)">
    <button class="btn-ghost btn-sm" style="padding:4px 8px;font-size:12px;color:var(--muted)" onclick="document.getElementById('src-edit-row-${n}').remove()">✕</button>`;
  list.appendChild(row);
}

function savePostSources(postId, convId) {
  const post = DB.posts.find(p => p.id === postId);
  if (!post) return;
  const sources = [];
  document.querySelectorAll(`#source-editor-${postId} [id^="src-edit-row-"]`).forEach(row => {
    const n = row.id.replace('src-edit-row-', '');
    const url = (document.getElementById('src-edit-url-' + n)||{}).value?.trim();
    const label = (document.getElementById('src-edit-label-' + n)||{}).value?.trim();
    if (url || label) sources.push({ url: url || '', label: label || url || '' });
  });
  post.sources = sources;
  DB.save();
  bw('PUT', '/api/posts/' + postId, { sources });
  editingSourcesPostId = null;
  toast('Sources saved.');
  renderConversation(convId);
}

function savePostEdit(postId, convId) {
  // The edit control is offered to admins AND to authors inside the 24h window
  // (see renderPost); gating the save on isAdmin() alone silently discarded
  // every edit a normal author made.
  const target = DB.posts.find(p => p.id === postId);
  if (!target) return;
  const authorInWindow = currentUser && currentUser.id === target.authorId
    && (Date.now() - (target.publishedAt || target.createdAt)) < EDIT_WINDOW_MS;
  if (!isAdmin() && !authorInWindow) return;
  const el = document.getElementById('post-edit-textarea');
  const content = el ? el.value.trim() : '';
  if (!content) { toast('Post cannot be empty.'); return; }
  const post = DB.posts.find(p => p.id === postId);
  if (post) {
    // Optimistic update; the server records the authoritative edit history and
    // enforces the edit window, so reconcile with whatever it returns.
    const previous = post.content;
    if (!post.edits) post.edits = [];
    post.edits.push({ content: previous, editedAt: Date.now() });
    post.content = content;
    DB.save();
    apiCall('PUT', '/api/posts/' + postId, { content })
      .then(saved => {
        if (!saved) return;
        Object.assign(post, saved);
        DB.save();
        renderConversation(convId);
      })
      .catch(e => {
        post.content = previous;
        post.edits.pop();
        DB.save();
        toast(e.message || 'Could not save your edit.');
        renderConversation(convId);
      });
  }
  editingPostId = null;
  toast('Post updated.');
  renderConversation(convId);
}

function saveDraft(convId) {

  const post = { id: DB.uid(), conversationId: convId, authorId: auth.id, content, draft: true, createdAt: Date.now() };

function publishDraft(postId) {

  if (!post) return;
  const content = document.getElementById('draft-edit-' + postId)?.value.trim() || post.content;

function publishConvDraft(convId) {
  const conv = DB.conversations.find(c => c.id === convId);
  if (!conv) return;
  const titleEl = document.getElementById('sandbox-title');
  const bodyEl = document.getElementById('sandbox-body');
  if (titleEl) conv.title = titleEl.value.trim() || conv.title;
  const openingPost = DB.posts.find(p => p.conversationId === convId && !p.parentId);
  const draftPosts = DB.posts.filter(p => p.conversationId === convId && p.draft);
  if (openingPost && bodyEl) { openingPost.content = bodyEl.value.trim() || openingPost.content; }
  draftPosts.forEach(p => { p.draft = false; bw('PUT', '/api/posts/' + p.id, { content: p.content, draft: false }); });
  conv.draft = false;
  conv.lastActivity = Date.now();
  DB.save();
  bw('PUT', '/api/conversations/' + convId, { title: conv.title, draft: false });

function requestJoin(convId) {
  const auth = getAuthUser();
  if (!auth) { navigate('login'); return; }
  const conv = DB.conversations.find(c => c.id === convId);
  if (!conv) return;
  if (!conv.joinRequests) conv.joinRequests = [];

  const msgEl = document.getElementById('join-request-msg');

  conv.joinRequests.push({ userId: auth.id, requestedAt: Date.now(), message });

function acceptJoinRequest(convId, userId) {
  const conv = DB.conversations.find(c => c.id === convId);
  if (!conv) return;
  conv.joinRequests = (conv.joinRequests || []).filter(r => r.userId !== userId);
  if (!(conv.participants || []).includes(userId)) conv.participants.push(userId);
  DB.save();
  bw('PUT', '/api/conversations/' + convId, { joinRequests: conv.joinRequests, participants: conv.participants });

}

function declineJoinRequest(convId, userId) {

async function deleteConversation(convId) {
  if (!isAdmin()) return;
  if (!confirm('Permanently delete this conversation and all its posts?')) return;
  // Delete on the server FIRST — a local-only delete used to look successful and
  // then silently reappear on the next reload when the server rejected it.
  if (BACKEND_URL) {
    try {
      await apiCall('DELETE', '/api/conversations/' + convId, null);
    } catch (e) {
      toast(e.message || 'Could not delete that conversation.');
      return;
    }
  }
  const idx = DB.conversations.findIndex(c => c.id === convId);
  if (idx !== -1) DB.conversations.splice(idx, 1);
  DB.posts = DB.posts.filter(p => p.conversationId !== convId);
  DB.comments = DB.comments.filter(c => c.conversationId !== convId);
  DB.save();
  toast('Conversation deleted.');
  navigate('home');
}

function voteConv(convId, type) {
  const auth = getAuthUser();
  if (!auth) { navigate('login'); return; }
  const conv = DB.conversations.find(c => c.id === convId);
  if (!conv) return;
  conv.likes = conv.likes || []; conv.dislikes = conv.dislikes || [];

  if (type === 'like') {
    if (conv.likes.includes(auth.id)) conv.likes = conv.likes.filter(id => id !== auth.id);
    else { conv.likes.push(auth.id); conv.dislikes = conv.dislikes.filter(id => id !== auth.id); }
  } else {
    if (conv.dislikes.includes(auth.id)) conv.dislikes = conv.dislikes.filter(id => id !== auth.id);
    else { conv.dislikes.push(auth.id); conv.likes = conv.likes.filter(id => id !== auth.id); }
  }
  DB.save();
  bw('POST', '/api/conversations/' + convId + '/vote', { type });
  renderConversation(convId);
}

async function addParticipant(convId) {
  const inp = document.getElementById('add-participant-input');
  const email = inp.value.trim().toLowerCase();
  if (!email) return;

  const auth = getAuthUser();
  const conv = DB.conversations.find(c => c.id === convId);
  if (!auth || !conv || !(conv.participants||[]).includes(auth.id)) {
    toast('Only participants can add others.'); return;
  }

  // Other users' email addresses are deliberately not exposed to the client, so
  // the server decides whether this address belongs to an existing account.
  let res;
  try {
    res = await apiCall('POST', '/api/conversations/' + convId + '/participants', { email });
  } catch (e) {
    toast(e.message || 'Could not add that person.');
    return;
  }
  inp.value = '';

  if (res && res.added && res.user) {
    if (!DB.users.some(u => u.id === res.user.id)) DB.users.push(res.user);
    if (!conv.participants.includes(res.user.id)) conv.participants.push(res.user.id);
    DB.save();
    toast(displayName(res.user) + ' added to conversation.');
    renderConversation(convId);
    return;
  }

  // No account yet — an invitation was recorded server-side.
  DB.invitations = DB.invitations || [];
  if (!DB.invitations.some(i => i.email === email && i.convId === convId))
    DB.invitations.push({ email, convId, invitedBy: auth.id, invitedAt: Date.now() });
  DB.save();

  const subject = encodeURIComponent('You\'ve been invited to join a conversation on Saloon');
  const body = encodeURIComponent(
    'Hi,\n\n' + displayName(auth) + ' has invited you to participate in a conversation on Saloon titled "' + conv.title + '".\n\nSaloon is a platform for thoughtful long-form conversation. Create a free account — you\'ll be added to this conversation automatically when you sign up with this email address.\n\n— Saloon\n\nconversation reimagined'
  );
  window.open('mailto:' + email + '?subject=' + subject + '&body=' + body, '_self');

  toast('Invitation sent to ' + email + '.');
  renderConversation(convId);
}
